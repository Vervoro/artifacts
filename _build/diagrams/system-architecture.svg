<svg class="diagram" viewBox="0 0 760 676" role="img" aria-label="Every change goes through the foundation; every send goes through the egress gate" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="sys-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Every change goes through the foundation; every send through the gate</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M120 108V136" marker-end="url(#sys-arrow)"/>
    <path d="M604 166H552" marker-end="url(#sys-arrow)"/>
    <path d="M472 136V108" marker-end="url(#sys-arrow)"/>
    <path d="M340 108V136" marker-end="url(#sys-arrow)"/>
    <path d="M300 238V262" marker-end="url(#sys-arrow)"/>
    <path d="M300 302V326" marker-end="url(#sys-arrow)"/>
    <path d="M190 412H206" marker-end="url(#sys-arrow)"/>
    <path d="M422 412H406" marker-end="url(#sys-arrow)"/>
    <path d="M491 460V488H328V500" marker-end="url(#sys-arrow)"/>
    <path d="M408 528H424" marker-end="url(#sys-arrow)"/>
    <path d="M576 528H604" marker-end="url(#sys-arrow)"/>
    <path d="M124 476V596" marker-end="url(#sys-arrow)"/>
  </g>

  <rect x="24" y="56" width="264" height="52" rx="8" class="box"/>
  <text x="156" y="78" text-anchor="middle" font-weight="600" class="ink">Phone-first client</text>
  <text x="156" y="96" text-anchor="middle" font-size="11.5" class="quiet">React; one UI package, one token package</text>

  <rect x="312" y="56" width="264" height="52" rx="8" class="box"/>
  <text x="444" y="78" text-anchor="middle" font-weight="600" class="ink">Inbound queue</text>
  <text x="444" y="96" text-anchor="middle" font-size="11.5" class="quiet">retries, then a dead-letter queue</text>

  <rect x="24" y="126" width="552" height="112" rx="8" class="band"/>
  <rect x="40" y="136" width="160" height="60" rx="8" class="box"/>
  <text x="120" y="160" text-anchor="middle" font-weight="600" class="ink">API</text>
  <text x="120" y="178" text-anchor="middle" font-size="11.5" class="quiet">access per request</text>
  <rect x="216" y="136" width="160" height="60" rx="8" class="box"/>
  <text x="296" y="160" text-anchor="middle" font-weight="600" class="ink">Background</text>
  <text x="296" y="176" text-anchor="middle" font-size="11.5" class="quiet">queue consumer</text>
  <text x="296" y="190" text-anchor="middle" font-size="11.5" class="quiet">sweeper per database</text>
  <rect x="392" y="136" width="160" height="60" rx="8" class="box"/>
  <text x="472" y="160" text-anchor="middle" font-weight="600" class="ink">Webhooks</text>
  <text x="472" y="178" text-anchor="middle" font-size="11.5" class="quiet">verify, queue, answer</text>
  <text x="300" y="222" text-anchor="middle" font-size="11.5" class="ink">Worker: one per environment, in the databases' EU region</text>

  <rect x="24" y="262" width="552" height="40" rx="8" class="band"/>
  <text x="300" y="286" text-anchor="middle" font-size="12" class="ink">Kernel: composition per company, Result, outbox, dispatcher</text>

  <rect x="24" y="326" width="552" height="150" rx="8" class="box"/>
  <text x="300" y="346" text-anchor="middle" font-size="12" font-weight="600" class="ink">Modules: own prefixed tables, talk through ports and events</text>

  <rect x="40" y="362" width="150" height="28" rx="6" class="box"/>
  <text x="115" y="381" text-anchor="middle" font-size="12" class="ink">Purchasing</text>
  <rect x="40" y="398" width="150" height="28" rx="6" class="box"/>
  <text x="115" y="417" text-anchor="middle" font-size="12" class="ink">Shipping, returns</text>
  <rect x="40" y="434" width="150" height="28" rx="6" class="box"/>
  <text x="115" y="453" text-anchor="middle" font-size="12" class="ink">Invoicing, reports</text>

  <rect x="206" y="362" width="200" height="100" rx="8" class="box-main"/>
  <text x="306" y="386" text-anchor="middle" font-weight="600" class="ink">Foundation</text>
  <g font-size="11.5" text-anchor="middle" class="ink">
    <text x="306" y="406">only writer of stock,</text>
    <text x="306" y="422">order status, desired state</text>
    <text x="306" y="438">append-only stock ledger</text>
  </g>

  <rect x="422" y="362" width="138" height="100" rx="8" class="box"/>
  <text x="491" y="386" text-anchor="middle" font-weight="600" class="ink">Channels host</text>
  <g font-size="11.5" text-anchor="middle" class="quiet">
    <text x="491" y="406">send rules</text>
    <text x="491" y="422">shadow or live</text>
    <text x="491" y="438">credentials, budgets</text>
  </g>

  <rect x="248" y="500" width="160" height="56" rx="8" class="box-main"/>
  <text x="328" y="522" text-anchor="middle" font-weight="600" class="ink">Egress gate</text>
  <text x="328" y="540" text-anchor="middle" font-size="11.5" class="ink">idempotent, rate-limited</text>

  <rect x="424" y="500" width="152" height="56" rx="8" class="box"/>
  <text x="500" y="522" text-anchor="middle" font-weight="600" class="ink">Connectors</text>
  <text x="500" y="540" text-anchor="middle" font-size="11.5" class="quiet">translate only</text>

  <text x="134" y="540" font-size="11.5" class="quiet">one transaction</text>

  <rect x="604" y="56" width="132" height="500" rx="8" class="box"/>
  <text x="670" y="80" text-anchor="middle" font-weight="600" class="ink">Marketplaces</text>
  <g font-size="11.5" text-anchor="middle" class="quiet">
    <text x="670" y="104">Amazon</text>
    <text x="670" y="120">eBay</text>
    <text x="670" y="136">Shopify</text>
    <text x="670" y="152">Walmart</text>
    <text x="670" y="168">TikTok Shop</text>
  </g>
  <path d="M616 488H724" class="edge" fill="none" stroke-width="1.25" stroke-dasharray="4 4"/>
  <g font-size="11.5" text-anchor="middle" class="quiet">
    <text x="670" y="510">in development</text>
    <text x="670" y="526">and tests:</text>
    <text x="670" y="542">simulators</text>
  </g>

  <rect x="24" y="596" width="200" height="56" rx="8" class="box"/>
  <text x="124" y="618" text-anchor="middle" font-weight="600" class="ink">Postgres, EU</text>
  <text x="124" y="636" text-anchor="middle" font-size="11.5" class="quiet">control database + cells</text>

  <rect x="248" y="596" width="488" height="56" rx="8" class="band"/>
  <text x="492" y="618" text-anchor="middle" font-size="11.5" class="ink">Through Hyperdrive, caching off; tenancy: ADR-001</text>
  <text x="492" y="636" text-anchor="middle" font-size="11.5" class="ink">Retention and the object-storage archive: ADR-002</text>
</svg>
