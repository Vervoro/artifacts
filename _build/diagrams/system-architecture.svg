<svg class="diagram" viewBox="0 0 760 520" role="img" aria-label="Modules call toward the core through ports; the core never calls them and tells them of changes through events" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="mod-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Modules call toward the core; the core never calls them</text>
  <rect x="24" y="48" width="712" height="44" rx="8" class="box" stroke-dasharray="5 4"/>
  <text x="380" y="75" text-anchor="middle" font-size="12" class="quiet">Parked until a record needs them: purchasing, Amazon Vendor, FBA shipments, profit, ads, AI, labels, MCP access</text>
  <rect x="24" y="112" width="712" height="160" rx="8" class="band"/>
  <text x="40" y="133" font-size="12" font-weight="600" class="ink">Outside the core</text>
  <text x="40" y="164" font-size="11.5" class="quiet">Switchable</text>
  <text x="40" y="178" font-size="11.5" class="quiet">per company</text>
  <text x="40" y="222" font-size="11.5" class="quiet">Always on</text>
  <rect x="124" y="144" width="140" height="52" rx="8" class="box"/>
  <text x="194" y="166" text-anchor="middle" font-weight="600" class="ink">Channels</text>
  <text x="194" y="184" text-anchor="middle" font-size="11.5" class="quiet">ADR-004, egress gate</text>

  <rect x="276" y="144" width="140" height="52" rx="8" class="box"/>
  <text x="346" y="166" text-anchor="middle" font-weight="600" class="ink">Connectors</text>
  <text x="346" y="184" text-anchor="middle" font-size="11.5" class="quiet">eBay, Amazon, Shopify</text>

  <rect x="428" y="144" width="140" height="52" rx="8" class="box"/>
  <text x="498" y="166" text-anchor="middle" font-weight="600" class="ink">Stock sync</text>
  <text x="498" y="184" text-anchor="middle" font-size="11.5" class="quiet">ADR-008, figures</text>

  <rect x="580" y="144" width="140" height="52" rx="8" class="box"/>
  <text x="650" y="166" text-anchor="middle" font-weight="600" class="ink">Invoicing</text>
  <text x="650" y="184" text-anchor="middle" font-size="11.5" class="quiet">ADR-011</text>

  <rect x="124" y="206" width="140" height="52" rx="8" class="box"/>
  <text x="194" y="228" text-anchor="middle" font-weight="600" class="ink">Fulfilment</text>
  <text x="194" y="246" text-anchor="middle" font-size="11.5" class="quiet">pick, pack, returns</text>

  <rect x="276" y="206" width="140" height="52" rx="8" class="box"/>
  <text x="346" y="228" text-anchor="middle" font-weight="600" class="ink">Billing</text>
  <text x="346" y="246" text-anchor="middle" font-size="11.5" class="quiet">ADR-012</text>

  <rect x="428" y="206" width="140" height="52" rx="8" class="box"/>
  <text x="498" y="228" text-anchor="middle" font-weight="600" class="ink">Purchasing</text>
  <text x="498" y="246" text-anchor="middle" font-size="11.5" class="quiet">ADR-015, suppliers</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M200 272V298" marker-end="url(#mod-arrow)"/>
    <path d="M560 298V274" stroke-dasharray="4 3" marker-end="url(#mod-arrow)"/>
    <path d="M380 410V432" marker-end="url(#mod-arrow)"/>
  </g>
  <text x="212" y="290" font-size="11.5" class="quiet">call through ports</text>
  <text x="572" y="290" font-size="11.5" class="quiet">hear of changes by events</text>
  <rect x="24" y="300" width="712" height="110" rx="8" class="band"/>
  <text x="40" y="320" font-size="12" font-weight="600" class="ink">The foundation (core): always on, each module the only writer of its own data</text>
  <rect x="32" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="85" y="360" text-anchor="middle" font-weight="600" class="ink">Products</text>
  <text x="85" y="378" text-anchor="middle" font-size="11.5" class="quiet">ADR-003</text>

  <rect x="150" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="203" y="360" text-anchor="middle" font-weight="600" class="ink">Listings</text>
  <text x="203" y="378" text-anchor="middle" font-size="11.5" class="quiet">links, ADR-005</text>

  <rect x="268" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="321" y="360" text-anchor="middle" font-weight="600" class="ink">Inventory</text>
  <text x="321" y="378" text-anchor="middle" font-size="11.5" class="quiet">stock, ledger</text>

  <rect x="386" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="439" y="360" text-anchor="middle" font-weight="600" class="ink">Orders</text>
  <text x="439" y="378" text-anchor="middle" font-size="11.5" class="quiet">order status</text>

  <rect x="504" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="557" y="360" text-anchor="middle" font-weight="600" class="ink">Buyer data</text>
  <text x="557" y="378" text-anchor="middle" font-size="11.5" class="quiet">ADR-009</text>

  <rect x="622" y="338" width="106" height="52" rx="8" class="box-main"/>
  <text x="675" y="360" text-anchor="middle" font-weight="600" class="ink">Access</text>
  <text x="675" y="378" text-anchor="middle" font-size="11.5" class="quiet">users, roles</text>

  <rect x="24" y="434" width="712" height="40" rx="8" class="band"/>
  <text x="380" y="458" text-anchor="middle" font-size="12" class="ink">Kernel and libraries: data layer, outbox, egress records, ports; UI, tokens, sealing</text>
  <text x="380" y="500" text-anchor="middle" font-size="11.5" class="quiet">Each module owns its tables, ports, routes, screens and tests; the app only mounts what modules contribute</text>
</svg>
