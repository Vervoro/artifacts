<svg class="diagram" viewBox="0 0 760 400" role="img" aria-label="Runtime: the app Worker and its platform parts in the EU, the sign-in Worker, Postgres through Hyperdrive, and outside services reached only through the egress gate" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="rt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Where the code runs</text>
  <rect x="24" y="48" width="220" height="52" rx="8" class="box"/>
  <text x="134" y="70" text-anchor="middle" font-weight="600" class="ink">Phone-first client</text>
  <text x="134" y="88" text-anchor="middle" font-size="11.5" class="quiet">built from the UI and token packages</text>

  <rect x="270" y="48" width="220" height="52" rx="8" class="box"/>
  <text x="380" y="70" text-anchor="middle" font-weight="600" class="ink">Sign-in Worker</text>
  <text x="380" y="88" text-anchor="middle" font-size="11.5" class="quiet">sign-in keys, login tables</text>

  <rect x="516" y="48" width="220" height="52" rx="8" class="box" stroke-dasharray="5 4"/>
  <text x="626" y="70" text-anchor="middle" font-weight="600" class="ink">Marketplaces and carriers</text>
  <text x="626" y="88" text-anchor="middle" font-size="11.5" class="quiet">simulators in development</text>

  <rect x="24" y="128" width="712" height="170" rx="8" class="band"/>
  <text x="40" y="146" font-size="12" font-weight="600" class="ink">App Worker and its platform parts, placed in the databases' EU region</text>
  <rect x="40" y="158" width="160" height="52" rx="8" class="box"/>
  <text x="120" y="180" text-anchor="middle" font-weight="600" class="ink">API</text>
  <text x="120" y="198" text-anchor="middle" font-size="11.5" class="quiet">and the client's files</text>

  <rect x="216" y="158" width="160" height="52" rx="8" class="box"/>
  <text x="296" y="180" text-anchor="middle" font-weight="600" class="ink">Sweeper</text>
  <text x="296" y="198" text-anchor="middle" font-size="11.5" class="quiet">one per database</text>

  <rect x="392" y="158" width="160" height="52" rx="8" class="box"/>
  <text x="472" y="180" text-anchor="middle" font-weight="600" class="ink">Webhooks</text>
  <text x="472" y="198" text-anchor="middle" font-size="11.5" class="quiet">verify, queue, answer</text>

  <rect x="568" y="158" width="160" height="52" rx="8" class="box"/>
  <text x="648" y="180" text-anchor="middle" font-weight="600" class="ink">Egress gate</text>
  <text x="648" y="198" text-anchor="middle" font-size="11.5" class="quiet">the only way out</text>

  <rect x="40" y="226" width="160" height="52" rx="8" class="box"/>
  <text x="120" y="248" text-anchor="middle" font-weight="600" class="ink">Live updates</text>
  <text x="120" y="266" text-anchor="middle" font-size="11.5" class="quiet">one per company</text>

  <rect x="216" y="226" width="160" height="52" rx="8" class="box"/>
  <text x="296" y="248" text-anchor="middle" font-weight="600" class="ink">Modules</text>
  <text x="296" y="266" text-anchor="middle" font-size="11.5" class="quiet">mounted per company</text>

  <rect x="392" y="226" width="160" height="52" rx="8" class="box"/>
  <text x="472" y="248" text-anchor="middle" font-weight="600" class="ink">Inbound queue</text>
  <text x="472" y="266" text-anchor="middle" font-size="11.5" class="quiet">retries, dead letters</text>

  <rect x="568" y="226" width="160" height="52" rx="8" class="box"/>
  <text x="648" y="248" text-anchor="middle" font-weight="600" class="ink">Queue consumer</text>
  <text x="648" y="266" text-anchor="middle" font-size="11.5" class="quiet">fetch, then import</text>

  <rect x="24" y="328" width="220" height="52" rx="8" class="box"/>
  <text x="134" y="350" text-anchor="middle" font-weight="600" class="ink">Hyperdrive</text>
  <text x="134" y="368" text-anchor="middle" font-size="11.5" class="quiet">one per database, no cache</text>

  <rect x="270" y="328" width="220" height="52" rx="8" class="box"/>
  <text x="380" y="350" text-anchor="middle" font-weight="600" class="ink">Postgres</text>
  <text x="380" y="368" text-anchor="middle" font-size="11.5" class="quiet">control and cells, EU</text>

  <rect x="516" y="328" width="220" height="52" rx="8" class="box"/>
  <text x="626" y="350" text-anchor="middle" font-weight="600" class="ink">Analytics store</text>
  <text x="626" y="368" text-anchor="middle" font-size="11.5" class="quiet">telemetry, never Postgres</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M120 100V156" marker-end="url(#rt-arrow)"/>
    <path d="M244 74H268" marker-end="url(#rt-arrow)"/>
    <path d="M384 100V326" stroke-dasharray="5 4" marker-end="url(#rt-arrow)"/>
    <path d="M180 158V114H320V102" marker-end="url(#rt-arrow)"/>
    <path d="M534 100V156" marker-end="url(#rt-arrow)"/>
    <path d="M472 210V224" marker-end="url(#rt-arrow)"/>
    <path d="M552 252H566" marker-end="url(#rt-arrow)"/>
    <path d="M660 158V102" marker-end="url(#rt-arrow)"/>
    <path d="M134 298V326" marker-end="url(#rt-arrow)"/>
    <path d="M244 354H268" marker-end="url(#rt-arrow)"/>
    <path d="M626 298V326" marker-end="url(#rt-arrow)"/>
  </g>
  <text x="196" y="110" font-size="11" class="quiet">is this session live?</text>
  <text x="390" y="318" font-size="11" class="quiet">own Hyperdrive, control only</text>
</svg>
