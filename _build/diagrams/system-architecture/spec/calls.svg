<svg class="diagram" viewBox="0 0 890 810" role="img" aria-label="Who calls whom for each event: a channel connected, a listing linked, an order arriving, stock received, an order shipped, a cancellation and a return" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
