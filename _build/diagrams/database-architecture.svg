<svg class="diagram" viewBox="0 0 760 452" role="img" aria-label="At launch, control and cell A; later cells and dedicated cells are added at their triggers. Every request reaches one database, which checks it holds the company" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Every request reaches one database, and that database checks it holds the company</text>
  <text x="24" y="50" font-size="11.5" class="quiet">Solid: at launch. Dashed and faded: later, built when its trigger arrives.</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M380 120V150" marker-end="url(#arch-arrow)"/>
    <path d="M380 206V228"/>
    <path d="M114 228H278"/>
    <path d="M114 228V250" marker-end="url(#arch-arrow)"/>
    <path d="M278 228V250" marker-end="url(#arch-arrow)"/>
  </g>
  <g class="edge" fill="none" stroke-width="1.25" stroke-dasharray="4 3" opacity="0.5">
    <path d="M278 228H674"/>
    <path d="M542 228V250" marker-end="url(#arch-arrow)"/>
    <path d="M674 228V250" marker-end="url(#arch-arrow)"/>
    <path d="M278 338V360H542V342" marker-end="url(#arch-arrow)"/>
  </g>
  <text x="410" y="376" text-anchor="middle" font-size="11.5" class="quiet" opacity="0.7">later: a move copies the slice, then marks the source moved_out</text>

  <rect x="230" y="64" width="300" height="56" rx="8" class="box"/>
  <text x="380" y="88" text-anchor="middle" font-weight="600" class="ink">Worker: API, sweepers, webhooks</text>
  <text x="380" y="106" text-anchor="middle" font-size="11.5" class="quiet">first statement: app.enter_company(id)</text>

  <rect x="230" y="150" width="300" height="56" rx="8" class="box-main"/>
  <text x="380" y="174" text-anchor="middle" font-weight="600" class="ink">forCompany(id)</text>
  <text x="380" y="192" text-anchor="middle" font-size="11.5" class="ink">reads control, cached; wrong database = error</text>
  <text x="122" y="222" font-size="11.5" class="quiet">where is this company?</text>

  <rect x="24" y="250" width="180" height="136" rx="8" class="box"/>
  <text x="114" y="274" text-anchor="middle" font-weight="600" class="ink">Control database</text>
  <g font-size="11.5" class="quiet">
    <text x="40" y="294">own compute</text>
    <text x="40" y="310">company + DB registry</text>
    <text x="40" y="326">auth schema, plans</text>
    <text x="40" y="342">erasure register</text>
    <text x="40" y="358">quotas, alerts, migrations</text>
    <text x="40" y="374">no business data</text>
  </g>

  <rect x="220" y="250" width="116" height="88" rx="8" class="box-main"/>
  <text x="278" y="274" text-anchor="middle" font-size="12" font-weight="600" class="ink">Cell A</text>
  <g font-size="11.5" text-anchor="middle" class="quiet"><text x="278" y="294">every company</text><text x="278" y="310">trials + canary</text><text x="278" y="326">forced RLS</text></g>

  <rect x="352" y="250" width="116" height="88" rx="8" class="box" stroke-dasharray="4 3"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" font-weight="600" class="ink">Restore branch</text>
  <g font-size="11.5" text-anchor="middle" class="quiet"><text x="410" y="294">look-back or drill</text><text x="410" y="310">runtime refused</text><text x="410" y="326">gone in 24 h</text></g>

  <g opacity="0.5">
    <rect x="484" y="250" width="116" height="88" rx="8" class="box" stroke-dasharray="4 3"/>
    <text x="542" y="274" text-anchor="middle" font-size="12" font-weight="600" class="ink">Cell B</text>
    <g font-size="11.5" text-anchor="middle" class="quiet"><text x="542" y="294">same schema</text><text x="542" y="310">new companies</text><text x="542" y="326">at ~160 in cell A</text></g>

    <rect x="616" y="250" width="116" height="88" rx="8" class="box" stroke-dasharray="4 3"/>
    <text x="674" y="274" text-anchor="middle" font-size="12" font-weight="600" class="ink">Dedicated cell</text>
    <g font-size="11.5" text-anchor="middle" class="quiet"><text x="674" y="294">one company</text><text x="674" y="310">own Neon project</text><text x="674" y="326">first enterprise</text></g>
  </g>

  <rect x="220" y="400" width="512" height="32" rx="8" class="band"/>
  <text x="476" y="420" text-anchor="middle" font-size="11.5" class="ink">one slice operation, in batches, as the lifecycle role: export, restore or erase one company</text>
</svg>
