<svg class="diagram" viewBox="0 0 760 548" role="img" aria-label="Stock goes out through the gate, the connector and the host's HTTP binding; notices come in through the endpoint, the queue and the consumer" xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="con-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">The connector only translates; the host holds everything that can hurt</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M256 138V114" marker-start="url(#con-arrow)" marker-end="url(#con-arrow)"/>
    <path d="M256 220V198" marker-end="url(#con-arrow)"/>
    <path d="M143 308V286" marker-end="url(#con-arrow)"/>
    <path d="M266 334H248" marker-end="url(#con-arrow)"/>
    <path d="M369 440V362" marker-end="url(#con-arrow)"/>
    <path d="M624 102V134" marker-end="url(#con-arrow)"/>
    <path d="M508 114V238H526" marker-end="url(#con-arrow)"/>
    <path d="M624 176V210" marker-end="url(#con-arrow)"/>
    <path d="M624 264V290" marker-end="url(#con-arrow)"/>
    <path d="M624 336V362" marker-end="url(#con-arrow)"/>
    <path d="M528 384H498V252H474" marker-end="url(#con-arrow)"/>
    <path d="M624 416V466H490" marker-end="url(#con-arrow)"/>
  </g>

  <rect x="24" y="48" width="712" height="64" rx="8" class="band"/>
  <rect x="40" y="60" width="200" height="40" rx="6" class="box"/>
  <text x="140" y="85" text-anchor="middle" font-weight="600" class="ink">eBay</text>
  <rect x="256" y="60" width="200" height="40" rx="6" class="box" stroke-dasharray="4 4"/>
  <text x="356" y="85" text-anchor="middle" font-size="12" class="quiet">Shopify and others, later</text>
  <rect x="528" y="60" width="192" height="40" rx="6" class="box"/>
  <text x="624" y="85" text-anchor="middle" font-weight="600" class="ink">Amazon Seller</text>

  <rect x="24" y="128" width="464" height="290" rx="8" class="band"/>
  <rect x="40" y="140" width="432" height="56" rx="8" class="box"/>
  <text x="256" y="162" text-anchor="middle" font-weight="600" class="ink">HTTP binding, one per account</text>
  <text x="256" y="180" text-anchor="middle" font-size="11.5" class="quiet">sealed credentials, token refresh, rate buckets, shared pools, call counts</text>

  <rect x="40" y="220" width="432" height="64" rx="8" class="box-main"/>
  <text x="256" y="244" text-anchor="middle" font-weight="600" class="ink">Connector plugin: a translator only</text>
  <text x="256" y="264" text-anchor="middle" font-size="11.5" class="ink">read orders · read listings · write stock · read back · parse notice</text>

  <rect x="40" y="308" width="206" height="52" rx="8" class="box"/>
  <text x="143" y="330" text-anchor="middle" font-weight="600" class="ink">Egress gate</text>
  <text x="143" y="348" text-anchor="middle" font-size="11.5" class="quiet">shadow records, live sends</text>

  <rect x="266" y="308" width="206" height="52" rx="8" class="box"/>
  <text x="369" y="330" text-anchor="middle" font-weight="600" class="ink">Send rules</text>
  <text x="369" y="348" text-anchor="middle" font-size="11.5" class="quiet">what to send, and when</text>

  <text x="256" y="400" text-anchor="middle" font-size="11.5" class="ink">Platform host: names no marketplace</text>

  <rect x="528" y="134" width="192" height="42" rx="8" class="box"/>
  <text x="624" y="152" text-anchor="middle" font-weight="600" class="ink">Relay in AWS</text>
  <text x="624" y="168" text-anchor="middle" font-size="11.5" class="quiet">queue and event bus to HTTPS</text>

  <rect x="528" y="210" width="192" height="54" rx="8" class="box"/>
  <text x="624" y="232" text-anchor="middle" font-weight="600" class="ink">Notice endpoint</text>
  <text x="624" y="250" text-anchor="middle" font-size="11.5" class="quiet">verify, find account, queue, answer</text>

  <rect x="528" y="290" width="192" height="46" rx="8" class="box"/>
  <text x="624" y="310" text-anchor="middle" font-weight="600" class="ink">Inbound queue</text>
  <text x="624" y="326" text-anchor="middle" font-size="11.5" class="quiet">retries, dead-letter queue</text>

  <rect x="528" y="362" width="192" height="54" rx="8" class="box"/>
  <text x="624" y="384" text-anchor="middle" font-weight="600" class="ink">Consumer</text>
  <text x="624" y="402" text-anchor="middle" font-size="11.5" class="quiet">parse, fetch the order, import</text>

  <rect x="24" y="440" width="464" height="52" rx="8" class="box"/>
  <text x="256" y="462" text-anchor="middle" font-weight="600" class="ink">Foundation</text>
  <text x="256" y="480" text-anchor="middle" font-size="11.5" class="quiet">only writer of stock, order status and desired state</text>

  <text x="24" y="526" font-size="11.5" class="quiet">In development and tests a simulator stands in for every marketplace; only the base address changes.</text>
</svg>
