<svg class="diagram" viewBox="0 0 900 400" role="img" aria-label="A person, or an operator on a managed laptop, signs in on the sign-in Worker's own pages, served under the app's address, with a passkey, or a password and an authenticator app code. Inside the sign-in Worker, Better Auth does passkeys, passwords, codes, backup codes, sessions, rate limits and the bot check; Vervoro's small policy layer adds Amazon's password rules, the password lockout, the session limits and recovery. The sign-in Worker alone holds Better Auth's secret, has its own lockfile, CI job and deploy token, and alone reads and writes the auth and auth_policy schemas in the control database, through its own Hyperdrive connection in the EU with caching off. Every other request goes to the app Worker, which asks the sign-in Worker over a service binding, through a closed list of calls, whose session it carries, gets back a login id, and has Access decide memberships, roles and grants in control with the runtime role. It never sees a password, a code or a secret. Dashed: later parts, per-method switches and a login-history screen." xmlns="http://www.w3.org/2000/svg" font-size="13">
  <defs>
    <marker id="si-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edge-fill"/></marker>
  </defs>
  <text x="24" y="26" font-size="15" font-weight="600" class="ink">The sign-in Worker, with Better Auth inside, is the only door to sign-in data</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M174 192H204V110H234" marker-end="url(#si-arrow)"/>
    <path d="M174 222H204V305H234" marker-end="url(#si-arrow)"/>
    <path d="M364 250V224" marker-end="url(#si-arrow)"/>
    <path d="M494 120H594" marker-end="url(#si-arrow)"/>
    <path d="M494 305H594" marker-end="url(#si-arrow)"/>
  </g>
  <text x="198" y="150" text-anchor="end" font-size="10" class="quiet">sign in</text>
  <text x="198" y="272" text-anchor="end" font-size="10" class="quiet">every other request</text>
  <text x="372" y="241" font-size="10" class="quiet">service binding: whose session? a login id</text>
  <text x="502" y="110" font-size="10" class="quiet">own Hyperdrive,</text>
  <text x="502" y="138" font-size="10" class="quiet">EU, no caching</text>
  <text x="502" y="295" font-size="10" class="quiet">runtime role</text>

  <rect x="24" y="170" width="150" height="72" rx="6" class="box"/>
  <text x="99" y="194" text-anchor="middle" font-weight="600" class="ink">Person</text>
  <text x="99" y="212" text-anchor="middle" font-size="10.5" class="quiet">own phone or laptop;</text>
  <text x="99" y="227" text-anchor="middle" font-size="10.5" class="quiet">operator: managed laptop</text>

  <rect x="234" y="40" width="260" height="184" rx="8" class="band"/>
  <text x="364" y="60" text-anchor="middle" font-weight="600" class="ink">Sign-in Worker</text>
  <text x="364" y="77" text-anchor="middle" font-size="11" class="quiet">its own pages, under the app's address</text>
  <rect x="250" y="86" width="228" height="58" rx="6" class="box"/>
  <text x="364" y="105" text-anchor="middle" font-weight="600" class="ink">Better Auth</text>
  <text x="364" y="121" text-anchor="middle" font-size="10.5" class="quiet">passkeys, password + code, backup codes,</text>
  <text x="364" y="136" text-anchor="middle" font-size="10.5" class="quiet">sessions, rate limit, bot check</text>
  <text x="364" y="160" text-anchor="middle" font-size="11" class="quiet">Vervoro policy: password rules, lockout,</text>
  <text x="364" y="175" text-anchor="middle" font-size="11" class="quiet">session limits, recovery; holds the secret</text>
  <rect x="250" y="186" width="228" height="28" rx="6" class="box" stroke-dasharray="4 3"/>
  <text x="364" y="204" text-anchor="middle" font-size="10.5" class="quiet">Later: per-method switches, history screen</text>

  <rect x="234" y="250" width="260" height="110" rx="8" class="band"/>
  <text x="364" y="272" text-anchor="middle" font-weight="600" class="ink">App Worker</text>
  <text x="364" y="293" text-anchor="middle" font-size="11" class="quiet">asks: session, enrol, reset, revoke,</text>
  <text x="364" y="309" text-anchor="middle" font-size="11" class="quiet">set email, incident commands</text>
  <text x="364" y="329" text-anchor="middle" font-size="11" class="quiet">gets a login id; Access decides the rest;</text>
  <text x="364" y="345" text-anchor="middle" font-size="11" class="quiet">never sees a password, code or secret</text>

  <rect x="594" y="40" width="282" height="320" rx="8" class="band"/>
  <text x="735" y="60" text-anchor="middle" font-weight="600" class="ink">Control database</text>

  <rect x="610" y="76" width="250" height="90" rx="6" class="box"/>
  <text x="735" y="97" text-anchor="middle" font-weight="600" class="ink">Sign-in data</text>
  <text x="735" y="115" text-anchor="middle" font-size="10.5" class="quiet">auth: Better Auth's tables, logins with</text>
  <text x="735" y="130" text-anchor="middle" font-size="10.5" class="quiet">their email, sessions, methods</text>
  <text x="735" y="145" text-anchor="middle" font-size="10.5" class="quiet">auth_policy: history, lockouts, waits</text>
  <text x="735" y="160" text-anchor="middle" font-size="10.5" class="quiet">sign-in role only</text>

  <rect x="610" y="270" width="250" height="74" rx="6" class="box"/>
  <text x="735" y="292" text-anchor="middle" font-weight="600" class="ink">Access data</text>
  <text x="735" y="310" text-anchor="middle" font-size="10.5" class="quiet">memberships, operator grants,</text>
  <text x="735" y="326" text-anchor="middle" font-size="10.5" class="quiet">the platform security log</text>

  <text x="24" y="388" font-size="11" class="quiet">The app's role has no right on the auth schemas. Better Auth says who a person is; ADR-010 says what they may do.</text>
</svg>
